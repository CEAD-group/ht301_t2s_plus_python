[project]
name = "ir-py-thermal"
version = "0.1.0"
description = "ir-py-thermal"
authors = [{name = "Dima", email = "me@dmytroengineering.com"}]
readme = "README.md"
requires-python = ">=3.10.4"
dependencies = [
    "matplotlib>=3.9.2",
    "pyserial>=3.5",
    "scikit-image>=0.25.2",
    "imageio-ffmpeg>=0.6.0",
    "imageio>=2.37.2",
    "pyusb>=1.3.1",
    "av>=16.0.1",
    "opencv-python>=4.12.0.88",
]

[project.urls]
repository = "https://github.com/diminDDL/IR-Py-Thermal"

[dependency-groups]
dev = [
    "ruff>=0.7.3",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ISC001",
    "COM812", # trailing comma missing
    "D203", # one-blank-line-before-class
    "D212", # multi-line-summary-first-line
    "T201", # print-found
    "TD002", # issue author missing
    "TD003", # issue link missing
    ]
